#
# Baseline CI for the `jsonpath` integration branch of the JSON-P JSONPath proposal.
# Builds the API and runs the unchanged TCK (tck/, profile tck-tests-ci) against Parsson 1.1.9 and the freshly built API.
#
# JDK 11 is not in the matrix: the API build (maven.compiler release 17 / multi-release jar) and the TCK modules
# (release 17) need at least JDK 17. The API itself still targets Java 11 bytecode.
#
name: JSONPath integration branch CI

on:
  push:
    branches: [ jsonpath ]
  pull_request:
    branches: [ jsonpath ]

concurrency:
  group: jsonpath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-tck:
    name: API + TCK on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version: [ 17, 21, 25 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          cache: maven
      - name: Build and install API
        run: cd api && mvn -B -V -U -C -Poss-release -Pstaging clean install -Dgpg.skip=true
      - name: TCK against Parsson
        run: cd tck && mvn -B -V -U -C -Ptck-tests-ci -Pstaging -Dgpg.skip=true -Djakarta.json-api.version=2.2.0-SNAPSHOT clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-reports-jdk${{ matrix.java_version }}
          path: tck/**/target/surefire-reports
          if-no-files-found: ignore
